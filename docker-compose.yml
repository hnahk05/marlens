services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: marlens
      POSTGRES_PASSWORD: marlens
      POSTGRES_DB: marlens
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql:/docker-entrypoint-initdb.d # chạy schema.sql lần đầu
volumes:
  pgdata:
